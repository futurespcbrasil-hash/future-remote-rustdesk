name: Future Remote - Actions diagnostic

on:
  push:
    branches:
      - future-remote-bootstrap
    paths:
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflow-admission-smoke-test:
    name: Validate basic Actions runner and repository access
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: future-remote-bootstrap
          submodules: recursive
          persist-credentials: false
      - name: Verify Future Remote configuration
        run: |
          python3 --version
          python3 scripts/configure_future_remote.py
      - name: Install Go for actionlint
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Lint every GitHub Actions workflow
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint" -color .github/workflows/flutter-ci.yml .github/workflows/flutter-build.yml .github/workflows/future-remote-diagnostics.yml
      - name: Validate build workflow files exist
        run: |
          test -s .github/workflows/flutter-ci.yml
          test -s .github/workflows/flutter-build.yml
          echo "Diagnostic passed. Basic runner, client configuration, and workflow lint are successful."
