name: Future Remote - client configuration validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/configure_future_remote.py"
      - ".github/workflows/future-remote-client-config.yml"
      - "libs/hbb_common"
      - "libs/portable/Cargo.toml"
      - "flutter/windows/runner/Runner.rc"
      - "flutter/macos/Runner/Info.plist"
      - "flutter/ios/Runner/Info.plist"

permissions:
  contents: read

jobs:
  configure-and-validate:
    name: Patch pinned app identity and server constants
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with pinned submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify pinned submodule matches the gitlink
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git submodule status libs/hbb_common | awk '{print $1}' | sed 's/^-//; s/^+//')"
          expected="$(git ls-tree HEAD libs/hbb_common | awk '{print $3}')"
          echo "Expected: $expected"
          echo "Actual:   $actual"
          test "$actual" = "$expected"

      - name: Apply Future Remote client configuration
        run: python3 scripts/configure_future_remote.py

      - name: Validate exact changes and whitespace
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -F 'pub static ref APP_NAME: RwLock<String> = RwLock::new("Future-Remote".to_owned());' libs/hbb_common/src/config.rs
          grep -F 'pub const RENDEZVOUS_SERVERS: &[&str] = &["future-remote.duckdns.org"];' libs/hbb_common/src/config.rs
          grep -F 'pub const RS_PUB_KEY: &str = "NgQBktnunnDC45ZaFZX9w1fixGsGD8Wb9J0WB94niB8=";' libs/hbb_common/src/config.rs
          grep -F 'VALUE "CompanyName", "Future Soluções"' flutter/windows/runner/Runner.rc
          grep -F 'VALUE "FileDescription", "Future Remote - Acesso remoto"' flutter/windows/runner/Runner.rc
          grep -F 'VALUE "ProductName", "Future Remote"' flutter/windows/runner/Runner.rc
          grep -F '<string>Future Remote</string>' flutter/macos/Runner/Info.plist
          grep -F '<string>Future Remote</string>' flutter/ios/Runner/Info.plist
          grep -F 'CompanyName = "Future Soluções"' libs/portable/Cargo.toml
          grep -F 'ProductName = "Future Remote"' libs/portable/Cargo.toml
          grep -F 'FileDescription = "Future Remote - Acesso remoto"' libs/portable/Cargo.toml
          grep -F 'OriginalFilename = "FutureRemote.exe"' libs/portable/Cargo.toml
          changed="$(git diff --name-only)"
          test "$changed" = "libs/hbb_common"
          echo "Identity/server patch validated. This job does not compile installers or modify the VPS."
