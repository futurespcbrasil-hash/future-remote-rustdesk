name: Future Remote - client configuration validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/configure_future_remote.py"
      - ".github/workflows/future-remote-client-config.yml"
      - "libs/hbb_common"

permissions:
  contents: read

jobs:
  configure-and-validate:
    name: Patch pinned server constants and validate diff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with pinned submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify pinned submodule matches the gitlink
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git submodule status libs/hbb_common | awk '{print $1}' | sed 's/^-//; s/^+//')"
          expected="$(git ls-tree HEAD libs/hbb_common | awk '{print $3}')"
          echo "Expected: $expected"
          echo "Actual:   $actual"
          test "$actual" = "$expected"

      - name: Apply Future Remote client configuration
        run: python3 scripts/configure_future_remote.py

      - name: Validate exact changes and whitespace
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -F 'pub const RENDEZVOUS_SERVERS: &[&str] = &["future-remote.duckdns.org"];' libs/hbb_common/src/config.rs
          grep -F 'pub const RS_PUB_KEY: &str = "NgQBktnunnDC45ZaFZX9w1fixGsGD8Wb9J0WB94niB8=";' libs/hbb_common/src/config.rs
          changed="$(git diff --name-only)"
          test "$changed" = "libs/hbb_common"
          echo "Configuration patch validated. This job does not compile installers or modify the VPS."
