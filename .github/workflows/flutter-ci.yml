name: Future Remote - build installers and Flutter CI

on:
  workflow_dispatch:
  # The full multi-platform build is run on branch pushes and manual dispatch.
  # Pull-request builds are covered by the lightweight CI and preflight workflows.
  push:
    branches:
      - master
      - future-remote-bootstrap
      - test/local-build-windows
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "appimage/**"
      - "flatpak/**"

# Keep only the newest installer build for this branch. Each commit used to
# enqueue the entire multi-platform RustDesk matrix, leaving many stale runs queued.
concurrency:
  group: future-remote-installers-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  run-ci:
    # Avoid running the reusable build workflow for untrusted fork PRs.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      macos-only: true

  verify-future-remote-installers:
    name: Verify Windows x64 EXE/MSI, Windows x86 and universal macOS artifacts
    needs: [run-ci]
    if: ${{ success() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download portable universal macOS app
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: future-remote-universal-macos-portable
          path: artifacts/macos-portable

      - name: Validate artifact files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import sys

          checks = [
              ("macOS portable universal", Path("artifacts/macos-portable"), ".zip", None, 10_000_000),
          ]
          failed = False
          for label, root, suffix, magic, minimum_size in checks:
              files = list(root.rglob(f"*{suffix}")) if root.exists() else []
              if len(files) != 1:
                  print(f"FAIL: {label}: expected one {suffix} file, found {len(files)} under {root}")
                  failed = True
                  continue
              path = files[0]
              size = path.stat().st_size
              if size < minimum_size:
                  print(f"FAIL: {label}: suspiciously small artifact ({size} bytes): {path}")
                  failed = True
                  continue
              if magic and path.read_bytes()[:len(magic)] != magic:
                  print(f"FAIL: {label}: invalid executable header: {path}")
                  failed = True
                  continue
              print(f"PASS: {label}: {path.name} ({size:,} bytes)")
          if failed:
              sys.exit(1)
          print("The Future Remote universal portable macOS app ZIP is present and passes basic file checks.")
          PY
